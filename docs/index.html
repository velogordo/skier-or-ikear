<body>
<style>
/* Layout: one-screen phone game — name card in the middle, two fat answer buttons in the thumb zone. */
:root {
  --bg: #eef3f6;          /* packed snow, faint blue */
  --surface: #ffffff;
  --ink: #15212b;
  --muted: #5b6b78;
  --line: #cfdae2;
  --track: rgba(21,33,43,.06);
  --wax: #d23a2a;         /* ski-wax red: skier */
  --wax-ink: #ffffff;
  --kraft: #c9975a;       /* flat-pack cardboard: IKEA-r */
  --kraft-ink: #2a1d0c;
  --good: #1f7a4f;
  --bad: #b3261e;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171f; --surface: #17232d; --ink: #e9f0f4; --muted: #93a4b1; --line: #2a3a47;
    --track: rgba(233,240,244,.05); --wax: #f0604c; --wax-ink: #1a0a07; --kraft: #dcae73; --kraft-ink: #24180a;
    --good: #4cc38a; --bad: #ff7a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171f; --surface: #17232d; --ink: #e9f0f4; --muted: #93a4b1; --line: #2a3a47;
  --track: rgba(233,240,244,.05); --wax: #f0604c; --wax-ink: #1a0a07; --kraft: #dcae73; --kraft-ink: #24180a;
  --good: #4cc38a; --bad: #ff7a70; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background:
    repeating-linear-gradient(100deg, transparent 0 46px, var(--track) 46px 52px, transparent 52px 64px, var(--track) 64px 70px, transparent 70px 180px),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
  padding-block: 14px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; line-height: 1; }
.logo .s { color: var(--wax); }
.logo .i { color: var(--kraft); }
.dots { display: flex; gap: 6px; }
.hright { display: flex; align-items: center; gap: 10px; }
.mode-link { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
  color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.mode-link:hover, .mode-link:focus-visible { background: var(--ink); color: var(--bg); }
.logo { white-space: nowrap; }
@media (max-width: 360px) { .logo { font-size: 1rem; } .hright { gap: 6px; } .dots { gap: 3px; } .dot { width: 7px; height: 7px; } .mode-link { padding: 3px 7px; } }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.dot.now { background: var(--ink); transform: scale(1.25); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }

main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.card {
  flex: 1 1 auto; min-height: 260px; max-height: 520px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 10px 30px -18px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 14px; padding: 24px 18px;
  position: relative; overflow: hidden;
}
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.name {
  font-family: var(--display); font-weight: 800; line-height: .95; letter-spacing: -.02em;
  overflow-wrap: anywhere; max-width: 100%;
}
.name.pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85); opacity: .3 } to { transform: none; opacity: 1 } }
.hint { color: var(--muted); max-width: 30ch; line-height: 1.4; margin: 0; text-wrap: balance; }

/* Reveal: race bib for skiers, product tag for flat-pack */
.reveal { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.bib {
  background: #fff; color: #15212b; border: 3px solid var(--wax);
  border-radius: 10px; padding: 12px 18px 14px; min-width: 220px; max-width: 100%; box-sizing: border-box;
  position: relative;
}
.bib::before, .bib::after { content: ""; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #b9c4cc; }
.bib::before { left: 8px; } .bib::after { right: 8px; }
.bib .num { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: var(--wax); font-variant-numeric: tabular-nums; }
.bib .who { font-weight: 700; font-size: 1.1rem; margin-top: 4px; }
.bib .meta { font-size: .9rem; color: #4a5a66; margin-top: 2px; }
.tag {
  background: var(--kraft); color: var(--kraft-ink);
  padding: 14px 22px 14px 34px; min-width: 220px; max-width: 100%; box-sizing: border-box;
  text-align: left; position: relative;
  clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%);
  border-radius: 4px;
}
.tag::before { content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--surface); }
.tag .prod { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; letter-spacing: .02em; }
.tag .type { font-weight: 600; font-size: 1rem; margin-top: 4px; }
.tag .meta { font-size: .8rem; opacity: .8; margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; }
/* Both: bib and price tag overlap, with a rubber stamp across them */
.verdict.both { color: var(--ink); }
.duo { position: relative; display: flex; align-items: center; justify-content: center; padding: 6px 0 46px; max-width: 100%; }
.duo .bib, .duo .tag { min-width: 0; width: 150px; flex: 0 1 150px; }
.duo .bib { transform: rotate(-5deg); z-index: 1; padding: 10px 12px 12px; }
.duo .bib .num { font-size: 2rem; }
.duo .bib .who { font-size: .95rem; }
.duo .bib .meta { font-size: .75rem; }
.duo .tag { transform: rotate(6deg) translateY(8px); margin-left: -6px; padding: 12px 14px 12px 30px; }
.duo .tag .prod { font-size: 1.25rem; overflow-wrap: anywhere; }
.duo .tag .type { font-size: .85rem; }
.stamp {
  position: absolute; left: 50%; bottom: 0; z-index: 2;
  transform: translate(-50%, 0) rotate(-6deg);
  font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--good); border: 4px solid var(--good); border-radius: 10px; padding: 2px 14px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp { from { transform: translate(-50%, 0) rotate(-6deg) scale(2.2); opacity: 0 } to { transform: translate(-50%, 0) rotate(-6deg) scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }
.fact { color: var(--muted); font-size: .95rem; margin: 0; max-width: 32ch; line-height: 1.4; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button {
  font-family: var(--display); font-weight: 800; font-size: 1.25rem;
  border: 0; border-radius: 18px; min-height: 76px; padding: 10px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .08s ease, filter .15s;
  touch-action: manipulation;
}
button small { font-family: var(--body); font-weight: 600; font-size: .78rem; opacity: .85; letter-spacing: .02em; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button:disabled { cursor: default; filter: saturate(.35) opacity(.55); }
button.chosen:disabled { filter: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ink); }
.b-skier { background: var(--wax); color: var(--wax-ink); }
.b-ikea { background: var(--kraft); color: var(--kraft-ink); }
.b-next { background: var(--ink); color: var(--bg); width: 100%; }
.b-ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* End screen */
.score { font-family: var(--display); font-weight: 800; font-size: clamp(4.5rem, 26vw, 7rem); line-height: .9; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: .45em; }
.wreath { width: 150px; height: 140px; display: block; margin: 0 auto -6px; overflow: visible; animation: wreath-in .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes wreath-in { from { transform: scale(.4) rotate(-20deg); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .wreath { animation: none; } }
.rank { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.recap { list-style: none; padding: 0; margin: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.recap li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.recap li:last-child { border-bottom: 0; }
.recap .mk { font-weight: 800; }
.recap .mk.ok { color: var(--good); }
.recap .mk.no { color: var(--bad); }
.recap b { font-family: var(--display); letter-spacing: .01em; }
.recap .what { color: var(--muted); font-size: .85rem; text-align: right; }
.endrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { min-height: 1.2em; text-align: center; color: var(--muted); font-size: .85rem; margin: 0; }
.share { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.b-share { min-height: 36px; padding: 6px 16px; font-size: .85rem; border-width: 1.5px; border-radius: 999px; }
footer a { color: var(--ink); font-weight: 600; }
footer { text-align: center; font-size: .72rem; color: var(--muted); line-height: 1.4; }
/* Title screen: premise, then the two modes as equal choices */
a.logo { text-decoration: none; color: inherit; }
.title-screen { display: flex; flex-direction: column; gap: 14px; }
.kicker { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; margin: 0; }
.big-title { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 3.4rem); line-height: .92; letter-spacing: -.02em; margin: 6px 0 0; text-align: center; text-wrap: balance; }
.big-title .s { color: var(--wax); } .big-title .i { color: var(--kraft); white-space: nowrap; }
.premise { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.premise .q { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.15; margin: 0; color: var(--ink); text-wrap: balance; }
.premise .q + .q { color: var(--wax); }
.premise p { margin: 6px 0 0; font-size: .88rem; line-height: 1.4; color: var(--muted); text-wrap: balance; }
.pair { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: .75rem; font-weight: 700; }
.pair .sk { border: 2px solid var(--wax); color: var(--wax); border-radius: 6px; padding: 2px 8px; }
.pair .ik { background: var(--kraft); color: var(--kraft-ink); border-radius: 6px; padding: 4px 8px; }
.modes { display: grid; gap: 10px; }
.mode { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border-radius: 16px; border: 2px solid var(--ink); background: var(--surface); }
.mode.sprint { border-color: var(--wax); }
.mode .ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 1.15rem;
  background: color-mix(in srgb, var(--kraft) 30%, var(--surface)); color: var(--ink); }
.mode.sprint .ic { background: color-mix(in srgb, var(--wax) 18%, var(--surface)); }
.mode h2 { font-family: var(--display); font-weight: 800; font-size: 1.2rem; margin: 0; display: flex; align-items: center; gap: 8px; }
.badge { font-family: var(--body); font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--wax); color: var(--wax-ink); border-radius: 4px; padding: 2px 6px; }
.mode p { margin: 2px 0 10px; font-size: .85rem; line-height: 1.35; color: var(--muted); }
.mode .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.b-mode { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; border-radius: 12px; font-family: var(--display); font-weight: 800; font-size: 1rem; text-decoration: none; }
.b-mode:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
a.b-mode.b-race { background: var(--wax); color: var(--wax-ink); }
.title-note { font-size: .8rem; color: var(--muted); text-align: center; margin: 0; }
.sprint-link { display: block; text-align: center; color: var(--ink); font-weight: 700; font-size: .95rem; }

@media (prefers-reduced-motion: reduce) { .name.pop { animation: none; } button, .dot { transition: none; } }
</style>

<div class="app">
  <header>
    <a class="logo" href="#" id="logo" aria-label="Skier or IKEA-r? title screen"><span class="s">Skier</span> or <span class="i">IKEA-r</span>?</a>
    <div class="hright">
      <div class="dots" id="dots" aria-label="Progress"></div>
    </div>
  </header>
  <main id="main"></main>
  <div class="share"><button class="b-ghost b-share" id="btn-share">Share with friends</button><p class="toast" id="share-toast"></p></div>
  <footer>Skiers from FIS World Cup fields and Swedish and Norwegian FIS registers; IKEA names from the IKEA range and Lars Petrus's IKEA Dictionary. Not affiliated with either. Made with good humour and a love-hate relationship with skiing and assembling furniture by <a href="https://bsky.app/profile/gordonr.ca" target="_blank" rel="noopener">Gord Ross</a>, 2026 🇨🇦</footer>
</div>

<script src="data.js"></script>
<script>
const ROUNDS = 7;

// Question lines and reactions rotate so each game reads a little differently.
const PROMPTS = [
  "World Cup cross-country skier, or something you build with an Allen key?",
  "Elite VO2max, or comes with one spare screw?",
  "Double-poles 50 km, or holds 50 kg per shelf?",
  "Lives in the wax room, or lives in the warehouse aisle?",
  "Knows their lactate threshold, or knows aisle 14, bin 22?",
  "Races in Lycra, or comes in a flat box?",
  "Skate or classic? Or particleboard?",
  "Vasaloppet finisher, or Saturday-afternoon argument?",
  "Grinds up Alpe Cermis, or wobbles on uneven floors?",
  "Eats 6,000 calories a day, or sold beside the meatballs?",
  "Has a coach, a physio and a wax tech, or a 24-step diagram with no words?",
];
const RIGHT = ["Correct!", "Nailed it.", "Clean pass.", "Perfect kick wax.", "Nailed the double pole.",
  "Fully assembled. No leftover screws.", "Podium!", "Glide for days."];
const WRONG = ["Nope.", "Wrong wax.", "Fell on the downhill.", "Missing screw.", "Built it upside down.",
  "Broke a pole.", "Herringboned the wrong way.", "Step 14 makes no sense.", "Klister on the glide zone."];
let lastPrompt = -1;
function nextPrompt() {
  let i;
  do { i = Math.floor(Math.random() * PROMPTS.length); } while (i === lastPrompt);
  lastPrompt = i;
  return PROMPTS[i];
}

const RANKS = [
  [0, "Flat-packed. Still in the box."],
  [2, "Missing a few dowels."],
  [3, "Some assembly required."],
  [4, "Solid tourer."],
  [5, "Wax technician."],
  [6, "Podium finish."],
  [7, "Perfect race. Klæbo-level."],
];

const pool = buildClassicPool();

const $main = document.getElementById("main");
const $dots = document.getElementById("dots");
let game;

function shuffle(a, rnd = Math.random) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// The game number (seed) decides the 7 names, so a challenge link replays the same game.
function pickRound(rnd) {
  // 3 or 4 of each kind, shuffled.
  const nSki = rnd() < .5 ? 3 : 4;
  const used = new Set();
  const take = (match, k) => {
    const picked = shuffle(pool.filter(q => match(q) && !used.has(q.n)), rnd).slice(0, k);
    picked.forEach(q => used.add(q.n));
    return picked;
  };
  // About one game in four gets a name that is both a skier and an IKEA product.
  const both = rnd() < .25 ? take(q => q.both, 1) : [];
  // Remaining skier slots: about 60% World Cup names, 40% from the FIS registers.
  let nFis = 0;
  for (let s = 0; s < nSki - both.length; s++) if (rnd() < .4) nFis++;
  return shuffle([
    ...both,
    ...take(q => q.tier === "wc", nSki - both.length - nFis),
    ...take(q => q.tier === "fis" && !q.both, nFis),
    ...take(q => q.kind === "ikea", ROUNDS - nSki),
  ], rnd);
}

let onTitle = false;
function renderTitle() {
  onTitle = true;
  $dots.hidden = true;
  $main.innerHTML = `
    <section class="title-screen">
      <p class="kicker">A game for skiers and flat-pack survivors</p>
      <h1 class="big-title"><span class="s">Skier</span> or <span class="i">IKEA-r</span>?</h1>
      <div class="premise">
        <p class="q">Think you know Nordic skiing?</p>
        <p class="q">Built one BILLY too many?</p>
        <p>Every name is either a World Cup cross-country racer or something you assemble with an Allen key. Can you tell which?</p>
        <div class="pair"><span class="sk">KALLA · skier</span><span class="ik">KALLAX · shelf</span></div>
      </div>
      <p class="kicker">Pick your event</p>
      <div class="modes">
        <div class="mode">
          <div class="ic" aria-hidden="true">7</div>
          <div>
            <h2>Classic</h2>
            <p>7 names, no clock. See what each one really is.</p>
            <button class="b-next b-mode" id="btn-classic">Play classic</button>
          </div>
        </div>
        <div class="mode sprint">
          <div class="ic" aria-hidden="true">⏱</div>
          <div>
            <h2>Sprint <span class="badge">Race mode</span></h2>
            <p>Race the World Cup field against the clock. Qualify, survive the heats, chase the crystal globe.</p>
            <div class="row2">
              <a class="b-mode b-race" href="sprint.html#start-m">Men's</a>
              <a class="b-mode b-race" href="sprint.html#start-w">Women's</a>
            </div>
          </div>
        </div>
      </div>
      <p class="title-note">Got a challenge link? It skips this screen.</p>
    </section>`;
  document.getElementById("btn-classic").addEventListener("click", () => newGame());
}

function newGame(seed = newSeed(), challenge = false) {
  onTitle = false;
  $dots.hidden = false;
  game = { seed, challenge, qs: pickRound(seededRandom(seed)), i: 0, answers: [] };
  renderQuestion();
}
const eyebrow = () => `${game.challenge ? `Challenge #${game.seed} · ` : ""}Question ${game.i + 1} of ${ROUNDS}`;

function renderDots() {
  $dots.innerHTML = "";
  for (let k = 0; k < ROUNDS; k++) {
    const d = document.createElement("span");
    d.className = "dot";
    if (k < game.answers.length) d.classList.add(game.answers[k] ? "ok" : "no");
    else if (k === game.i) d.classList.add("now");
    $dots.appendChild(d);
  }
  $dots.setAttribute("aria-label", `Question ${Math.min(game.i + 1, ROUNDS)} of ${ROUNDS}`);
}

function nameSize(n) {
  const len = [...n].length;
  return `min(${Math.min(5.5, 30 / len).toFixed(2)}rem, ${(125 / len).toFixed(1)}vw)`;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderQuestion() {
  const q = game.qs[game.i];
  renderDots();
  $main.innerHTML = `
    <section class="card" aria-live="polite">
      <div class="eyebrow">${eyebrow()}</div>
      <div class="name pop" style="font-size:${nameSize(q.n)}">${esc(q.n)}</div>
      <p class="hint">${esc(nextPrompt())}</p>
    </section>
    <div class="answers">
      <button class="b-skier" id="btn-skier" data-k="skier">Skier<small>on snow</small></button>
      <button class="b-ikea" id="btn-ikea" data-k="ikea">IKEA-r<small>in a flat box</small></button>
    </div>`;
  $main.querySelectorAll(".answers button").forEach(b => b.addEventListener("click", () => answer(b.dataset.k)));
  const $n = $main.querySelector(".name");
  fitName($n);
  if (document.fonts) document.fonts.ready.then(() => { if ($n.isConnected) { $n.style.fontSize = nameSize(q.n); fitName($n); } });
}

function answer(kind) {
  if (game.answers.length > game.i) return;
  const q = game.qs[game.i];
  const ok = q.both ? true : kind === q.kind;
  game.answers.push(ok);
  renderDots();

  const bib = () => {
    const [cname, flag] = COUNTRY[q.c] || [q.c, ""];
    return `<div class="bib">
        <div class="num">${esc(q.c)}</div>
        <div class="who">${esc(q.full)}</div>
        <div class="meta">${flag} ${esc(cname)} · ${q.tier === "wc" ? "FIS World Cup" : "FIS-registered racer"}</div>
      </div>`;
  };
  const tag = type => `<div class="tag">
        <div class="prod">${esc(q.n)}</div>
        <div class="type">${esc(type)}</div>
        <div class="meta">Assembly required</div>
      </div>`;

  let badge, verdict, fact = q.fact;
  if (q.both) {
    badge = `<div class="duo">${bib()}${tag(q.both.type)}<div class="stamp">Both!</div></div>`;
    verdict = ["both", pickOne(["Trick question!", "Plot twist!", "Double agent!"])];
    fact = [q.fact, q.both.fact].filter(Boolean).join(" ") + " Either answer counts.";
  } else {
    badge = q.kind === "skier" ? bib() : tag(q.type);
    verdict = ok ? ["ok", pickOne(RIGHT)] : ["no", pickOne(WRONG)];
  }
  const card = $main.querySelector(".card");
  card.innerHTML = `
    <div class="eyebrow">${eyebrow()}</div>
    <div class="reveal">
      <div class="verdict ${verdict[0]}">${verdict[1]}</div>
      ${badge}
      ${fact ? `<p class="fact">${esc(fact)}</p>` : ""}
    </div>`;

  const ans = $main.querySelector(".answers");
  ans.querySelectorAll("button").forEach(b => { b.disabled = true; if (b.dataset.k === kind) b.classList.add("chosen"); });
  const last = game.i === ROUNDS - 1;
  const next = document.createElement("button");
  next.className = "b-next"; next.id = "btn-next";
  next.innerHTML = last ? "See my score" : "Next";
  next.addEventListener("click", () => { game.i++; last ? renderEnd() : renderQuestion(); });
  ans.replaceWith(next);
  next.focus({ preventScroll: true });
}

function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }

// A laurel wreath with a red ribbon, for a perfect 7/7.
function wreathSvg() {
  const cx = 75, cy = 66, r = 48, rad = d => d * Math.PI / 180;
  let stems = "", leaves = "";
  for (const side of [-1, 1]) {
    const at = d => side < 0 ? d : 180 - d;     // mirror the left branch for the right
    const p = d => [cx + r * Math.cos(rad(at(d))), cy + r * Math.sin(rad(at(d)))];
    const [x0, y0] = p(102), [x1, y1] = p(270);
    stems += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${side < 0 ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#4a6b2f" stroke-width="2"/>`;
    for (let i = 0; i <= 9; i++) {
      const d = 108 + i * 17.6, [x, y] = p(d);
      const travel = at(d) + 90 * -side;
      const sides = i === 9 ? [0] : [-38, 38];
      for (const o of sides) {
        const rot = travel + o, len = i === 9 ? 9 : 8.5;
        const lx = x + 7 * Math.cos(rad(rot)), ly = y + 7 * Math.sin(rad(rot));
        const fill = (i + (o > 0 ? 1 : 0)) % 2 ? "#4f8a3c" : "#6ea84f";
        leaves += `<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="${len}" ry="3.8" fill="${fill}" stroke="#3b6a2c" stroke-width=".8" transform="rotate(${rot.toFixed(0)} ${lx.toFixed(1)} ${ly.toFixed(1)})"/>`;
      }
    }
  }
  const ribbon = `<path d="M75 112 L60 134 L66 134 L70 140 L76 118 Z M75 112 L90 134 L84 134 L80 140 L74 118 Z" fill="#b8172f"/>
    <path d="M75 112 Q58 98 56 110 Q56 120 75 112 Z M75 112 Q92 98 94 110 Q94 120 75 112 Z" fill="#d62839" stroke="#9b1426" stroke-width="1"/>
    <circle cx="75" cy="112" r="4.5" fill="#9b1426"/>`;
  return `<svg class="wreath" viewBox="0 0 150 140" role="img" aria-label="Laurel wreath">${stems}${leaves}${ribbon}</svg>`;
}

function renderEnd() {
  const score = game.answers.filter(Boolean).length;
  const rank = [...RANKS].reverse().find(([min]) => score >= min)[1];
  renderDots();
  $dots.setAttribute("aria-label", `Final score ${score} of ${ROUNDS}`);
  const rows = game.qs.map((q, k) => `
    <li><span class="mk ${game.answers[k] ? "ok" : "no"}">${game.answers[k] ? "✓" : "✗"}</span>
      <b>${esc(q.n)}</b>
      <span class="what">${q.both ? "Skier + IKEA" : q.kind === "skier" ? `Skier · ${esc(q.c)}` : esc(q.type)}</span></li>`).join("");
  $main.innerHTML = `
    <section class="card" aria-live="polite">
      <div class="eyebrow">Final score · Game #${game.seed}</div>
      ${score === ROUNDS ? wreathSvg() : ""}
      <div class="score">${score}<span>/${ROUNDS}</span></div>
      <p class="rank">${esc(rank)}</p>
      <ul class="recap">${rows}</ul>
    </section>
    <div class="endrow">
      <button class="b-next" id="btn-again">Play again</button>
      <button class="b-ghost" id="btn-copy">Challenge a friend</button>
    </div>
    <p class="toast" id="toast"></p>
    <a class="sprint-link" href="#" id="change-mode">Change mode</a>`;
  document.getElementById("btn-again").addEventListener("click", () => { clearHash(); newGame(); });
  document.getElementById("change-mode").addEventListener("click", e => { e.preventDefault(); clearHash(); renderTitle(); window.scrollTo(0, 0); });
  document.getElementById("btn-copy").addEventListener("click", () => copyScore(score, rank));
  document.getElementById("btn-again").focus({ preventScroll: true });
}

function copyScore(score, rank) {
  const grid = game.answers.map(a => a ? "🟩" : "🟥").join("");
  const text = `Skier or IKEA-r? Game #${game.seed}: ${score}/${ROUNDS} ${grid}\n${rank}${score === ROUNDS ? " 🌿 Laurel wreath!" : ""}\nSame 7 names. Can you beat me?`;
  shareOrCopy(text, `${SHARE_URL}#game-${game.seed}`, document.getElementById("toast"), "Challenge copied. Paste it in the group chat.");
}

document.addEventListener("keydown", e => {
  if (!game || onTitle) return;
  const k = e.key.toLowerCase();
  if (game.answers.length === game.i && game.i < ROUNDS) {
    if (k === "s" || k === "arrowleft") answer("skier");
    if (k === "i" || k === "arrowright") answer("ikea");
  }
});

{ // A challenge link (#game-12345) replays that game; otherwise show the title screen.
  const m = location.hash.match(/^#game-(\d{5})$/);
  m ? newGame(+m[1], true) : renderTitle();
}
document.getElementById("logo").addEventListener("click", e => { e.preventDefault(); clearHash(); renderTitle(); window.scrollTo(0, 0); });
setupShare("");
window.addEventListener("hashchange", () => location.reload());   // a challenge link opened in an open tab
</script>
</body>
</html>
