<title>Skier or IKEA-r?</title>

<style>
/* Layout: one-screen phone game — name card in the middle, two fat answer buttons in the thumb zone. */
:root {
  --bg: #eef3f6;          /* packed snow, faint blue */
  --surface: #ffffff;
  --ink: #15212b;
  --muted: #5b6b78;
  --line: #cfdae2;
  --track: rgba(21,33,43,.06);
  --wax: #d23a2a;         /* ski-wax red: skier */
  --wax-ink: #ffffff;
  --kraft: #c9975a;       /* flat-pack cardboard: IKEA-r */
  --kraft-ink: #2a1d0c;
  --good: #1f7a4f;
  --bad: #b3261e;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171f; --surface: #17232d; --ink: #e9f0f4; --muted: #93a4b1; --line: #2a3a47;
    --track: rgba(233,240,244,.05); --wax: #f0604c; --wax-ink: #1a0a07; --kraft: #dcae73; --kraft-ink: #24180a;
    --good: #4cc38a; --bad: #ff7a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171f; --surface: #17232d; --ink: #e9f0f4; --muted: #93a4b1; --line: #2a3a47;
  --track: rgba(233,240,244,.05); --wax: #f0604c; --wax-ink: #1a0a07; --kraft: #dcae73; --kraft-ink: #24180a;
  --good: #4cc38a; --bad: #ff7a70; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background:
    repeating-linear-gradient(100deg, transparent 0 46px, var(--track) 46px 52px, transparent 52px 64px, var(--track) 64px 70px, transparent 70px 180px),
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box;
  min-height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
  padding-block: 14px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; line-height: 1; }
.logo .s { color: var(--wax); }
.logo .i { color: var(--kraft); }
.dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.dot.now { background: var(--ink); transform: scale(1.25); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }

main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.card {
  flex: 1 1 auto; min-height: 260px; max-height: 520px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 10px 30px -18px rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 14px; padding: 24px 18px;
  position: relative; overflow: hidden;
}
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.name {
  font-family: var(--display); font-weight: 800; line-height: .95; letter-spacing: -.02em;
  overflow-wrap: anywhere; max-width: 100%;
}
.name.pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85); opacity: .3 } to { transform: none; opacity: 1 } }
.hint { color: var(--muted); max-width: 30ch; line-height: 1.4; margin: 0; text-wrap: balance; }

/* Reveal: race bib for skiers, product tag for flat-pack */
.reveal { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.bib {
  background: #fff; color: #15212b; border: 3px solid var(--wax);
  border-radius: 10px; padding: 12px 18px 14px; min-width: 220px; max-width: 100%; box-sizing: border-box;
  position: relative;
}
.bib::before, .bib::after { content: ""; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #b9c4cc; }
.bib::before { left: 8px; } .bib::after { right: 8px; }
.bib .num { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: var(--wax); font-variant-numeric: tabular-nums; }
.bib .who { font-weight: 700; font-size: 1.1rem; margin-top: 4px; }
.bib .meta { font-size: .9rem; color: #4a5a66; margin-top: 2px; }
.tag {
  background: var(--kraft); color: var(--kraft-ink);
  padding: 14px 22px 14px 34px; min-width: 220px; max-width: 100%; box-sizing: border-box;
  text-align: left; position: relative;
  clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%);
  border-radius: 4px;
}
.tag::before { content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--surface); }
.tag .prod { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; letter-spacing: .02em; }
.tag .type { font-weight: 600; font-size: 1rem; margin-top: 4px; }
.tag .meta { font-size: .8rem; opacity: .8; margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; }
/* Both: bib and price tag overlap, with a rubber stamp across them */
.verdict.both { color: var(--ink); }
.duo { position: relative; display: flex; align-items: center; justify-content: center; padding: 6px 0 46px; max-width: 100%; }
.duo .bib, .duo .tag { min-width: 0; width: 150px; flex: 0 1 150px; }
.duo .bib { transform: rotate(-5deg); z-index: 1; padding: 10px 12px 12px; }
.duo .bib .num { font-size: 2rem; }
.duo .bib .who { font-size: .95rem; }
.duo .bib .meta { font-size: .75rem; }
.duo .tag { transform: rotate(6deg) translateY(8px); margin-left: -6px; padding: 12px 14px 12px 30px; }
.duo .tag .prod { font-size: 1.25rem; overflow-wrap: anywhere; }
.duo .tag .type { font-size: .85rem; }
.stamp {
  position: absolute; left: 50%; bottom: 0; z-index: 2;
  transform: translate(-50%, 0) rotate(-6deg);
  font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--good); border: 4px solid var(--good); border-radius: 10px; padding: 2px 14px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp { from { transform: translate(-50%, 0) rotate(-6deg) scale(2.2); opacity: 0 } to { transform: translate(-50%, 0) rotate(-6deg) scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }
.fact { color: var(--muted); font-size: .95rem; margin: 0; max-width: 32ch; line-height: 1.4; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button {
  font-family: var(--display); font-weight: 800; font-size: 1.25rem;
  border: 0; border-radius: 18px; min-height: 76px; padding: 10px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .08s ease, filter .15s;
  touch-action: manipulation;
}
button small { font-family: var(--body); font-weight: 600; font-size: .78rem; opacity: .85; letter-spacing: .02em; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button:disabled { cursor: default; filter: saturate(.35) opacity(.55); }
button.chosen:disabled { filter: none; box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ink); }
.b-skier { background: var(--wax); color: var(--wax-ink); }
.b-ikea { background: var(--kraft); color: var(--kraft-ink); }
.b-next { background: var(--ink); color: var(--bg); width: 100%; }
.b-ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* End screen */
.score { font-family: var(--display); font-weight: 800; font-size: clamp(4.5rem, 26vw, 7rem); line-height: .9; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: .45em; }
.rank { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.recap { list-style: none; padding: 0; margin: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.recap li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: .95rem; }
.recap li:last-child { border-bottom: 0; }
.recap .mk { font-weight: 800; }
.recap .mk.ok { color: var(--good); }
.recap .mk.no { color: var(--bad); }
.recap b { font-family: var(--display); letter-spacing: .01em; }
.recap .what { color: var(--muted); font-size: .85rem; text-align: right; }
.endrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { min-height: 1.2em; text-align: center; color: var(--muted); font-size: .85rem; margin: 0; }
footer { text-align: center; font-size: .72rem; color: var(--muted); line-height: 1.4; }

@media (prefers-reduced-motion: reduce) { .name.pop { animation: none; } button, .dot { transition: none; } }
</style>

      return d.m.startsWith("slang ") ? `Swedish slang for "${d.m.slice(6)}".` : `Swedish for "${d.m}".`;
    }
    if (d.cat === "n") return "Also a Scandinavian first name.";
    if (d.cat === "p") return "Named after a place in the Nordic countries.";
    return "";
  };
  pool.forEach(q => { if (q.kind === "ikea" && !q.fact) q.fact = dictFact(q.n); });
  // A skier whose surname is also an IKEA name becomes a "both" question: either answer counts.
  const markBoth = (n, type) => {
    const s = pool.find(q => q.n === n && q.kind === "skier");
    if (s && !s.both) s.both = { type, fact: dictFact(n) };
  };
  IKEA_SERIES.forEach(n => {
    if (taken.has(n)) return markBoth(n, "Product series");
    taken.add(n);
    pool.push({ kind: "ikea", n, type: "Product series", fact: dictFact(n) });
  });
  IKEA_DICT.forEach(([n]) => {
    if (taken.has(n)) return markBoth(n, "IKEA product name");
    taken.add(n);
    pool.push({ kind: "ikea", n, type: "IKEA product name", fact: dictFact(n) });
  });
}

const $main = document.getElementById("main");
const $dots = document.getElementById("dots");
const seen = new Set();
let game;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pickRound() {
  // 3 or 4 of each kind, shuffled; avoid names seen in earlier games until the pool runs low.
  const nSki = Math.random() < .5 ? 3 : 4;
  const take = (match, k) => {
    let fresh = pool.filter(q => match(q) && !seen.has(q.n));
    if (fresh.length < k) { pool.forEach(q => match(q) && seen.delete(q.n)); fresh = pool.filter(match); }
    return shuffle(fresh).slice(0, k);
  };
  // About one game in four gets a name that is both a skier and an IKEA product.
  const both = Math.random() < .25 ? take(q => q.both, 1) : [];
  // Remaining skier slots: about 60% World Cup names, 40% from the FIS registers.
  let nFis = 0;
  for (let s = 0; s < nSki - both.length; s++) if (Math.random() < .4) nFis++;
  const qs = shuffle([
    ...both,
    ...take(q => q.tier === "wc", nSki - both.length - nFis),
    ...take(q => q.tier === "fis" && !q.both, nFis),
    ...take(q => q.kind === "ikea", ROUNDS - nSki),
  ]);
  qs.forEach(q => seen.add(q.n));
  return qs;
}

function newGame() {
  game = { qs: pickRound(), i: 0, answers: [] };
  renderQuestion();
}

function renderDots() {
  $dots.innerHTML = "";
  for (let k = 0; k < ROUNDS; k++) {
    const d = document.createElement("span");
    d.className = "dot";
    if (k < game.answers.length) d.classList.add(game.answers[k] ? "ok" : "no");
    else if (k === game.i) d.classList.add("now");
    $dots.appendChild(d);
  }
  $dots.setAttribute("aria-label", `Question ${Math.min(game.i + 1, ROUNDS)} of ${ROUNDS}`);
}

function nameSize(n) {
  const len = [...n].length;
  return `min(${Math.min(5.5, 30 / len).toFixed(2)}rem, ${(125 / len).toFixed(1)}vw)`;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderQuestion() {
  const q = game.qs[game.i];
  renderDots();
  $main.innerHTML = `
    <section class="card" aria-live="polite">
      <div class="eyebrow">Question ${game.i + 1} of ${ROUNDS}</div>
      <div class="name pop" style="font-size:${nameSize(q.n)}">${esc(q.n)}</div>
      <p class="hint">World Cup cross-country skier, or something you build with an Allen key?</p>
    </section>
    <div class="answers">
      <button class="b-skier" id="btn-skier" data-k="skier">Skier<small>on snow</small></button>
      <button class="b-ikea" id="btn-ikea" data-k="ikea">IKEA-r<small>in a flat box</small></button>
    </div>`;
  $main.querySelectorAll(".answers button").forEach(b => b.addEventListener("click", () => answer(b.dataset.k)));
}

function answer(kind) {
  if (game.answers.length > game.i) return;
  const q = game.qs[game.i];
  const ok = q.both ? true : kind === q.kind;
  game.answers.push(ok);
  renderDots();

  const bib = () => {
    const [cname, flag] = COUNTRY[q.c] || [q.c, ""];
    return `<div class="bib">
        <div class="num">${esc(q.c)}</div>
        <div class="who">${esc(q.full)}</div>
        <div class="meta">${flag} ${esc(cname)} · ${q.tier === "wc" ? "FIS World Cup" : "FIS-registered racer"}</div>
      </div>`;
  };
  const tag = type => `<div class="tag">
        <div class="prod">${esc(q.n)}</div>
        <div class="type">${esc(type)}</div>
        <div class="meta">Assembly required</div>
      </div>`;

  let badge, verdict, fact = q.fact;
  if (q.both) {
    badge = `<div class="duo">${bib()}${tag(q.both.type)}<div class="stamp">Both!</div></div>`;
    verdict = ["both", pickOne(["Trick question!", "Plot twist!", "Double agent!"])];
    fact = [q.fact, q.both.fact].filter(Boolean).join(" ") + " Either answer counts.";
  } else {
    badge = q.kind === "skier" ? bib() : tag(q.type);
    verdict = ok ? ["ok", pickOne(["Correct!", "Nailed it.", "Clean pass.", "Yes!"])]
                 : ["no", pickOne(["Nope.", "Fell over.", "Wrong wax.", "Missing screw."])];
  }
  const card = $main.querySelector(".card");
  card.innerHTML = `
    <div class="eyebrow">Question ${game.i + 1} of ${ROUNDS}</div>
    <div class="reveal">
      <div class="verdict ${verdict[0]}">${verdict[1]}</div>
      ${badge}
      ${fact ? `<p class="fact">${esc(fact)}</p>` : ""}
    </div>`;

  const ans = $main.querySelector(".answers");
  ans.querySelectorAll("button").forEach(b => { b.disabled = true; if (b.dataset.k === kind) b.classList.add("chosen"); });
  const last = game.i === ROUNDS - 1;
  const next = document.createElement("button");
  next.className = "b-next"; next.id = "btn-next";
  next.innerHTML = last ? "See my score" : "Next";
  next.addEventListener("click", () => { game.i++; last ? renderEnd() : renderQuestion(); });
  ans.replaceWith(next);
  next.focus({ preventScroll: true });
}

function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }

function renderEnd() {
  const score = game.answers.filter(Boolean).length;
  const rank = [...RANKS].reverse().find(([min]) => score >= min)[1];
  renderDots();
  $dots.setAttribute("aria-label", `Final score ${score} of ${ROUNDS}`);
  const rows = game.qs.map((q, k) => `
    <li><span class="mk ${game.answers[k] ? "ok" : "no"}">${game.answers[k] ? "✓" : "✗"}</span>
      <b>${esc(q.n)}</b>
      <span class="what">${q.both ? "Skier + IKEA" : q.kind === "skier" ? `Skier · ${esc(q.c)}` : esc(q.type)}</span></li>`).join("");
  $main.innerHTML = `
    <section class="card" aria-live="polite">
      <div class="eyebrow">Final score</div>
      <div class="score">${score}<span>/${ROUNDS}</span></div>
      <p class="rank">${esc(rank)}</p>
      <ul class="recap">${rows}</ul>
    </section>
    <div class="endrow">
      <button class="b-next" id="btn-again">Play again</button>
      <button class="b-ghost" id="btn-copy">Copy score</button>
    </div>
    <p class="toast" id="toast"></p>`;
  document.getElementById("btn-again").addEventListener("click", newGame);
  document.getElementById("btn-copy").addEventListener("click", () => copyScore(score, rank));
  document.getElementById("btn-again").focus({ preventScroll: true });
}

function copyScore(score, rank) {
  const grid = game.answers.map(a => a ? "🟩" : "🟥").join("");
  const text = `Skier or IKEA-r? ${score}/${ROUNDS} ${grid}\n${rank}`;
  const toast = document.getElementById("toast");
  const fallback = () => { toast.textContent = text; const r = document.createRange(); r.selectNodeContents(toast); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try {
    navigator.clipboard.writeText(text).then(() => { toast.textContent = "Copied. Paste it in the group chat."; }, fallback);
  } catch (e) { fallback(); }
}

document.addEventListener("keydown", e => {
  if (!game) return;
  const k = e.key.toLowerCase();
  if (game.answers.length === game.i && game.i < ROUNDS) {
    if (k === "s" || k === "arrowleft") answer("skier");
    if (k === "i" || k === "arrowright") answer("ikea");
  }
});

newGame();
</script>
